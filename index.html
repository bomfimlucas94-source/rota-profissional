  if(!r.ok)throw new Error('Falha de conexão ('+r.status+'). Tente de novo.');
  return r.json();
}

document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(S.leitura){toast('Modo visualização: ações do médico estão desativadas.');return}
  if(e.target.id==='fchat'){enviaChat(CH.txt,false);return}
  if(e.target.id==='flogp'){enviaLog();return}
  if(e.target.id==='flogin'){
    const cel=$('#cel').value,pin=$('#pin').value;if(!cel||!pin){S.err='Preencha o celular e o PIN.';render();return}
    S.busy=true;S.err='';render();
    try{const r=await rpc('app_login',{p_celular:cel,p_pin:pin});
      if(!r.ok){S.err=r.erro;S.busy=false;render();$('#cel').value=cel;return}
      if(r.tipo==='motorista'){try{localStorage.setItem('rm-token',r.token);localStorage.setItem('rm-nome',r.nome);if(r.trocar_pin){localStorage.setItem('rm-trocar','1');sessionStorage.setItem('rm-pin-tmp',pin)}else localStorage.removeItem('rm-trocar')}catch(x){}location.href='motorista.html';return}
      S.token=r.token;S.nome=r.nome;S.trocar=!!r.trocar_pin;try{localStorage.setItem('rp-token',r.token);localStorage.setItem('rp-nome',r.nome);if(S.trocar)localStorage.setItem('rp-trocar','1');else localStorage.removeItem('rp-trocar')}catch(x){}
      S.busy=false;S.tela='rota';if(S.trocar){PIN_TMP=pin;render();return}await carregar();
    }catch(x){S.err=x.message;S.busy=false;render()}
  }
  if(e.target.id==='fpin'){
    const pa=PIN_TMP||($('#pa')?$('#pa').value:''),pn=$('#pn').value,pn2=$('#pn2').value;
    if(!pa||!pn){S.err='Preencha os campos.';render();return}
    if(pn!==pn2){S.err='Os dois PINs novos não são iguais.';render();return}
    S.busy=true;S.err='';render();
    try{const r=await rpc('app_trocar_pin',{p_token:S.token,p_atual:pa,p_novo:pn});S.busy=false;
      if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo com o PIN provisório.');S.err=r.erro;render();return}
      S.trocar=false;PIN_TMP='';try{localStorage.removeItem('rp-trocar')}catch(x){}toast('PIN criado. Use ele nas próximas vezes.');await carregar();
    }catch(x){S.err=x.message;S.busy=false;render()}
    return;
  }
  if(e.target.id==='fped'){
    const ro=rotaAtual(),de=$('#de')?$('#de').value:'',ate=$('#ate')?$('#ate').value:'',mot=$('#mot').value.trim();
    if((S.tipo==='horario_fixo'&&(!de||!ate))||(S.tipo==='nao_antes'&&!de)){toast('Informe o horário.');return}
    if(S.tipo==='horario_fixo'&&de>=ate){toast('O horário final precisa ser depois do inicial.');return}
    if(!mot){toast('Escreva o motivo do pedido.');$('#mot').focus();return}
    S.busy=true;render();
    try{const r=await rpc('app_pedir',{p_token:S.token,p_rota:ro.id,p_ordem:+S.sel,p_tipo:S.tipo,p_de:de,p_ate:ate,p_motivo:mot});
      S.busy=false;if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');toast(r.erro);render();return}
      toast('Pedido enviado à logística.');S.tela='pedidos';await carregar();
    }catch(x){S.busy=false;render();toast(x.message)}
  }
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.dia){S.dia=b.dataset.dia;if(S.tela==='chat'||S.tela==='chatresp')S.tela='rota';render();return}
  if(S.leitura&&(b.dataset.pac||['confirmar','embarquei','instalar'].includes(b.dataset.a))){toast('Modo visualização: ações do médico estão desativadas.');return}
  if(b.dataset.pac){S.sel=b.dataset.pac;S.tipo='horario_fixo';S.tela='pedido';render();window.scrollTo(0,0);return}
  if(b.dataset.pronta!=null){enviaChat(CH.d.respostas[+b.dataset.pronta],true);return}
  if(b.dataset.rup){const i=+b.dataset.rup;if(i>0){[CH.ed[i-1],CH.ed[i]]=[CH.ed[i],CH.ed[i-1]];render()}return}
  if(b.dataset.rdel){CH.ed.splice(+b.dataset.rdel,1);render();return}
  if(b.dataset.rsug){if(CH.ed.length<6){CH.ed.push(b.dataset.rsug);render()}return}

  const a=b.dataset.a;if(!a)return;
  if(a==='sair'){sair();return}

  if(a==='chat'){S.tela='chat';CH.n=-1;render();window.scrollTo(0,0);carregaChat();return}
  if(a==='chatresp'){CH.ed=(CH.d.respostas||[]).slice();S.tela='chatresp';render();window.scrollTo(0,0);return}

    CH.d.respostas=r.respostas;S.tela='chat';toast('Respostas salvas.');render();fimChat()}catch(x){CH.busy=false;toast(x.message);render()}return}
  if(a==='embarquei'){const ro=rotaAtual();if(ro){try{localStorage.setItem('rp-emb-'+ro.id,'1')}catch(x){}}render();toast('Boa rota!');return}

  if(a==='evo'){S.evoAberto=!S.evoAberto;render();return}

  if(a==='carmax'){if(T.mel){const mx=T.mel.classList.toggle('max');b.textContent=mx?'⤡ Diminuir mapa':'⤢ Ampliar mapa';setTimeout(()=>T.map&&T.map.invalidateSize(),60)}return}
  if(a==='pushon'){const ok=await pushAssinar(true);toast(ok?'Notificações ativadas.':pushMsg==='bloqueado'||Notification.permission==='denied'?'Notificações bloqueadas para este site. Libere em Configurações do navegador › Notificações.':(pushMsg||'Não foi possível ativar agora.'));render();return}
  if(a==='pushx'){pushFechado=true;try{localStorage.setItem('rp-push','x')}catch(x){}render();return}
  if(a==='instx'){instFechado=true;try{localStorage.setItem('rp-inst','x')}catch(x){}render();return}
  if(a==='evotab'){S.tela='evo';render();window.scrollTo(0,0);carregarEvo();return}
  if(a==='rota'||a==='pedidos'){S.tela=a;render();window.scrollTo(0,0);if(a==='pedidos')carregar(true);return}
  if(a==='zoom'){S.zoom=true;render();return}
  if(a==='fechar'){S.zoom=false;render();return}
  if(a==='atualizar'){await carregar();toast('Atualizado.');return}
  if(a==='confirmar'){const ro=rotaAtual();S.busy=true;render();
    try{const r=await rpc('app_confirmar',{p_token:S.token,p_rota:ro.id});S.busy=false;if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');toast('Rota confirmada. Obrigado!');await carregar()}
    catch(x){S.busy=false;render();toast(x.message)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.zoom){S.zoom=false;render()}});
setInterval(()=>{if(S.token&&!document.hidden&&S.tela!=='pedido'&&S.tela!=='chat'&&S.tela!=='chatresp')carregar(true)},60000);
setInterval(()=>{if(!S.token||S.trocar||document.hidden)return;if(S.tela==='chat'&&!CH.busy)carregaChat(true);else if(S.tela!=='chatresp')carregaResumo()},12000);
function abreChatHash(h){const m=String(h||'').match(/#chat=(\d+)/);if(!m||!S.token)return false;S.dia=m[1];S.tela='chat';CH.n=-1;try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}render();carregaChat();return true}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token&&S.tela!=='pedido')carregar(true)});
render();if(S.token){carregar().then(()=>{abreChatHash(location.hash);carregaResumo()})}

/* justificativa pedida pela logística */
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form[data-just]');if(f){S.jd=S.jd||{};S.jd[f.dataset.just]=e.target.value}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset||!f.dataset.just)return;e.preventDefault();const t=(f.querySelector('textarea').value||'').trim();if(t.length<5){toast('Escreva a justificativa.');return}
 const bt=f.querySelector('button');bt.disabled=true;try{const r=await rpc('app_justificar',{p_token:S.token,p_id:+f.dataset.just,p_texto:t});if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');bt.disabled=false;toast(r.erro||'Não foi possível enviar.');return}
 if(S.jd)delete S.jd[f.dataset.just];toast('Justificativa enviada à logística.');await carregar()}catch(x){bt.disabled=false;toast('Não foi possível enviar agora.')}});

/* Canal direto com a Logística (e avisos para todos) */
function logTela(){let h=`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:4px"><b style="font-size:17px">Canal com a Logística</b><small style="color:var(--muted);font-size:12.5px">Fale com a Logística a qualquer hora, sem depender da rota. Os avisos gerais também aparecem aqui.</small></div>`;
 if(LG.err)h+=`<p class="err" role="alert">${esc(LG.err)}</p>`;
 if(LG.msgs==null)return h+'<p class="empty">Abrindo a conversa…</p>';
 h+='<div class="bubs" aria-live="polite">';if(!LG.msgs.length)h+='<p class="empty" style="padding:16px">Nenhuma mensagem ainda.</p>';
 LG.msgs.forEach(m=>{const eu=m.de==='usuario';const hoje=new Date(m.em).toDateString()===new Date().toDateString();h+=`<div class="bub${eu?' eu':' cen'}">${eu?'':`<small style="margin:0 0 2px;font-weight:700">${m.aviso?'📢 Aviso da Logística':'Logística · '+esc(String(m.autor||'').split(' ')[0])}</small>`}${esc(m.texto)}<small>${hoje?hm(m.em):new Date(m.em).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+hm(m.em)}</small></div>`});
 h+='</div>';if(S.leitura)return h;
 return h+`<div class="chatfoot"><form class="envia" id="flogp"><label for="ltxt" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Mensagem para a Logística</label><input id="ltxt" maxlength="800" autocomplete="off" placeholder="Mensagem para a Logística" value="${esc(LG.txt)}"><button type="submit"${LG.busy?' disabled':''}>Enviar</button></form></div>`}
function fimLog(){const l=document.querySelector('.bub:last-child');if(l)l.scrollIntoView({block:'end'})}
async function carregaLog(sil){try{const r=await rpc('app_canal',{p_token:S.token,p_ler:true});if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');LG.err=r.erro;LG.msgs=LG.msgs||[];render();return}
 const mudou=!LG.msgs||LG.msgs.length!==r.msgs.length;LG.msgs=r.msgs;LG.nl=r.nao_lidas||0;LG.err='';if(S.tela==='log'&&(mudou||!sil)){const f=document.activeElement&&document.activeElement.id==='ltxt';render();fimLog();if(f){const i=document.getElementById('ltxt');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}}catch(e){if(!sil){LG.err='Não foi possível abrir a conversa agora.';LG.msgs=LG.msgs||[];render()}}}
async function contaLog(){try{const r=await rpc('app_canal',{p_token:S.token,p_ler:false});if(r&&r.ok&&r.nao_lidas!==LG.nl){LG.nl=r.nao_lidas;if(S.tela!=='pedido'&&S.tela!=='chat')render()}}catch(e){}}
async function enviaLog(){const t=String(LG.txt||'').trim();if(!t||LG.busy)return;LG.busy=true;render();
 try{const r=await rpc('app_canal_enviar',{p_token:S.token,p_texto:t});LG.busy=false;if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');toast(r.erro);render();return}
  LG.txt='';LG.msgs=r.msgs;render();fimLog();const i=document.getElementById('ltxt');if(i)i.focus()}catch(x){LG.busy=false;toast('Não foi possível enviar agora.');render()}}
document.addEventListener('input',e=>{if(e.target.id==='ltxt')LG.txt=e.target.value});
let lgTick=0;setInterval(()=>{if(!S.token||S.trocar||document.hidden)return;lgTick++;if(S.tela==='log')carregaLog(true);else if(lgTick%3===0)contaLog()},12000);
setTimeout(()=>{if(S.token&&!S.trocar)contaLog()},2000);
if(/^#canal/.test(location.hash)&&S.token){S.tela='log';try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}setTimeout(()=>{render();carregaLog()},300)}
</script>
