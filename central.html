<style>
:root{--wine:#5f0040;--wine-d:#3a0026;--sun:#fbb040;--peach:#f2d1a0;--warm:#d7d2cb;--bg:#f7f5f1;--surface:#fff;--ink:#2b0a1f;--muted:#6d5d64;--line:#e4ddd6;--off:#f3efea;--ok:#1d6b3a;--ok-bg:#dff3e5;--pend:#7a4300;--pend-bg:#fff0d6;--bad:#8f1d2b;--bad-bg:#fbe2e5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit}

.portal{display:block;height:34px;width:auto;max-width:100%;margin:6px auto 0;align-self:center}.logo{display:block;height:24px;width:auto;max-width:100%;align-self:flex-start;margin:0}

.lbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:22px}

.btn{min-height:46px;border:0;border-radius:12px;font-size:14.5px;font-weight:800;padding:0 16px}
.btn.sun{background:var(--sun);color:var(--wine-d)}

.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:0}

.jnint{margin:2px 2px 10px}.jntw{max-height:none}table.jnt{min-width:820px}table.jnt tr.off td{color:var(--muted)}table.jnt tr.off b{font-weight:600}

.jnvazio{text-align:center;color:var(--muted);padding:22px!important}.jnhr td{background:var(--off)}.jnhl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.jnhl li{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}.jnhl small{color:var(--muted);min-width:190px}
.jned td{background:#fffaf2}.jnform{display:flex;flex-direction:column;gap:10px}.jnform h4{margin:0;font-size:13.5px;color:var(--wine)}.jnfg{display:grid;grid-template-columns:minmax(220px,2fr) minmax(120px,1fr) 120px 120px minmax(200px,2fr);gap:10px}
.jnfg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}.jnfg input{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;min-height:38px}
.jnbt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.jnbt .sp{flex:1}.jnbt label.ck{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
@media(max-width:900px){.jnfg{grid-template-columns:1fr 1fr}.jnfg .jnp,.jnfg .jno{grid-column:1/-1}}

<body>
<div id="app"></div>
<script>
const SB='https://sizbevhqreaccxrlimup.supabase.co',KEY='sb_publishable_sOPBmFvZMrGj3JvHzxIyYQ_4LsvUbSG';
const TIPOS={horario_fixo:'Horário fixo',nao_antes:'Não atender antes de',trocar_ordem:'Trocar a ordem',nao_atender:'Paciente não será atendido',observacao:'Observação para o motorista'};
const STN={pendente:'Pendente',questionada:'Aguardando justificativa',aprovada:'Aprovada',recusada:'Recusada',aplicada:'Aplicada no SimpliRoute'};
const LOGI=()=>S.perfil!=='adm_medico'&&S.perfil!=='adm_enfermagem';
/* administrativo médico / de enfermagem: só a própria equipe (o banco também trava) */
const AREA=()=>S.perfil==='adm_enfermagem'?'enfermagem':S.perfil==='adm_medico'?'medica':null;
const ADM_TABS=()=>S.perfil==='adm_medico'?['jan','env','can','evo','fro']:['jan','env','can','fro'];
const podeTab=t=>LOGI()||ADM_TABS().includes(t);
const perfilNome=p=>p==='adm_medico'?'Administrativo médico':p==='adm_enfermagem'?'Administrativo de enfermagem':'Logística';
const S={token:null,nome:'',perfil:'logistica',itens:null,err:'',busy:false,f:{st:'',esp:'',dia:''},open:{},draft:{},at:0,tab:'sol'};
// Segurança: a sessão fica só nesta aba (sessionStorage). Fechou o navegador ou abriu o link em outra aba/pessoa → pede celular e PIN.
const INATIVO_MIN=120;
/* Central dentro do Painel de Escala (escala.solarcuidados.log.br): a sessão vem do painel, que também controla a inatividade */
const PAINEL_ORIGEM='https://escala.solarcuidados.log.br';
const EMBED=new URLSearchParams(location.search).has('embed')&&window.parent!==window;
if(EMBED)document.documentElement.classList.add('embed');
const avisaPainel=m=>{if(EMBED)try{parent.postMessage(m,PAINEL_ORIGEM)}catch(e){}};
try{localStorage.removeItem('lg-token');localStorage.removeItem('lg-nome');S.token=sessionStorage.getItem('lg-token');S.nome=sessionStorage.getItem('lg-nome')||'';S.tab=localStorage.getItem('lg-tab')||'sol';if(S.tab==='mot')S.tab='motf';if(S.tab==='rel')S.tab='env';S.perfil=sessionStorage.getItem('lg-perfil')||'logistica';
 const ult=+sessionStorage.getItem('lg-ult')||0;if(S.token&&Date.now()-ult>INATIVO_MIN*6e4){S.token=null;sessionStorage.removeItem('lg-token')}}catch(e){}
let _ultAviso=0;const marcaUso=()=>{try{sessionStorage.setItem('lg-ult',String(Date.now()))}catch(e){}if(EMBED&&Date.now()-_ultAviso>15000){_ultAviso=Date.now();avisaPainel({tipo:'central-uso'})}};if(EMBED){S.token=null}marcaUso();
/* qualquer uso (clique, toque, digitação, rolagem) conta como atividade */
let _ultUso=0;['pointerdown','keydown','input','wheel','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{const t=Date.now();if(t-_ultUso>15000){_ultUso=t;marcaUso()}},{passive:true,capture:true}));
['click','keydown','touchstart'].forEach(ev=>addEventListener(ev,marcaUso,{passive:true}));
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn,args){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error('Falha de conexão ('+r.status+'). Tente de novo.');return r.json()}
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
const dm=k=>k.slice(8,10)+'/'+k.slice(5,7);
const dExt=k=>{const s=new Date(k+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'});return s[0].toUpperCase()+s.slice(1)};
const hm=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const jan=r=>r.tipo==='horario_fixo'?(r.horario_de||'?')+' – '+(r.horario_ate||'?'):r.tipo==='nao_antes'?'a partir de '+(r.horario_de||'?'):'';
function sair(msg){if(EMBED){S.token=null;S.itens=null;avisaPainel({tipo:'central-sair',msg:msg||''});render();return}S.trocar=false;PIN_TMP='';try{if(S.token)rpc('eq_sair',{p_token:S.token}).catch(()=>{});sessionStorage.removeItem('lg-token');sessionStorage.removeItem('lg-nome');sessionStorage.removeItem('lg-perfil')}catch(e){}S.token=null;S.perfil='logistica';S.itens=null;S.err=msg||'';render()}
async function carregar(sil){if(!S.token||S.trocar)return;
 if(!LOGI()){try{const r=await rpc('eq_check',{p_token:S.token});if(!r.ok)return sair('Sua sessão expirou. Entre de novo.');S.nome=r.nome;S.perfil=r.perfil||'adm_medico';try{sessionStorage.setItem('lg-perfil',S.perfil)}catch(x){}if(LOGI())return carregar(sil);if(!podeTab(S.tab))S.tab=ADM_TABS()[0];if(S.tab==='fro'&&!F.d)carregarFrota();if(S.tab==='evo'&&!V.d)carregarEvoC();if(S.tab==='env'&&!E.db)carregarEnv(false);if(S.tab==='jan'&&JN.itens===null)carregarJan(true);if(!K.d||S.tab==='can')carregarCanal(true);render()}catch(e){}return}
 try{const r=await rpc('eq_solicitacoes',{p_token:S.token});if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');throw new Error(r.erro)}
  S.nome=r.nome;S.itens=r.itens||[];S.lists=r.lists||null;S.err='';S.at=Date.now();render()}catch(e){if(!sil){S.err=e.message;render()}}}

/* ===== Envio de rotas (SimpliRoute → Minha Rota) ===== */
const hojeSP=(d=0)=>{const t=new Date(Date.now()+d*864e5);return t.toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'})};
const E={data:hojeSP(),sr:null,db:null,prof:[],busy:false,err:'',f:'',pick:{},ini:false,at:0,semRota:0,srAt:0};
try{E.ini=localStorage.getItem('lg-ini')==='1'}catch(e){}
const TPV={med_visit:'Visita médica',enf_visit:'Enfermagem',admissao_visit:'Admissão',avaliacao_visit:'Avaliação',avaliacao_admissao_visit:'Avaliação de admissão'};
const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const STOPW=new Set(['da','de','do','das','dos','e']);
const toks=s=>nrm(s).split(' ').filter(w=>w&&!STOPW.has(w));
function casa(a,b){const x=toks(a),y=toks(b);if(!x.length||!y.length)return false;if(x.join(' ')===y.join(' '))return true;if(x[0]!==y[0]||x[x.length-1]!==y[y.length-1])return false;const[c,l]=x.length<y.length?[x,y]:[y,x];return c.every(w=>l.includes(w))}
const iniciais=n=>String(n||'').split(/\s+/).filter(w=>w&&!/^(da|de|do|das|dos|e)$/i.test(w)).map(w=>w[0].toUpperCase()+'.').join(' ');
const chave=r=>r.veiculo+(r.compartilhada&&r.compartilhada.length?' · '+(r.skill||'?').split(' ')[0]:'');
function achaProf(r){for(const c of [r.skill,r.motorista]){if(!c)continue;const m=E.prof.filter(p=>casa(p.nome,c));if(m.length===1)return m[0]}return null}
const pacOf=r=>r.visitas.map(v=>({ordem:v.ordem,nome:E.ini?iniciais(v.nome):v.nome,bairro:v.bairro||'',hora:v.hora&&v.hora!=='00:00'?v.hora:'',janela:v.janela&&v.janela!=='00:00–23:59'?v.janela:'',endereco:v.endereco||'',lat:v.lat,lng:v.lng}));
const sig=p=>JSON.stringify((p||[]).map(x=>[x.ordem,x.hora||'',x.lat||0,x.lng||0]));
const hh=t=>t?new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
function estado(r){const d=E.db&&E.db[chave(r)];if(!d)return{k:'nao',d};if(sig(d.pacientes)!==sig(pacOf(r)))return{k:'mud',d};return{k:d.confirmado_em?'conf':d.visto_em?'vis':'env',d}}
async function carregarEnv(puxar,sil){if(!S.token||S.trocar)return;if(!LOGI())puxar=false;
 if(puxar){E.busy=true;E.err='';render()}
 try{
  const jobs=[rpc('eq_rotas_dia',{p_token:S.token,p_data:E.data})];
  if(puxar)jobs.push(fetch(SB+'/functions/v1/simpliroute',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token:S.token,data:E.data})}).then(r=>r.json()));
  const [db,sr]=await Promise.all(jobs);
  if(!db.ok){if(db.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');throw new Error(db.erro)}
  E.prof=db.profissionais||[];E.db={};(db.rotas||[]).forEach(x=>E.db[x.placa]=x);E.at=Date.now();
  if(sr){if(!sr.ok){if(sr.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');throw new Error(sr.erro||'Não foi possível ler o SimpliRoute.')}E.sr=sr.rotas||[];E.semRota=sr.sem_rota||0;E.srAt=Date.now()}
  E.err=''}catch(e){if(!sil)E.err=e.message}
 E.busy=false;render()}
function renderEnv(){
 let h=`<div class="bar"><input type="date" id="edata" value="${E.data}" aria-label="Dia das rotas"><button class="btn ghost sm" type="button" data-dia="0">Hoje</button><button class="btn ghost sm" type="button" data-dia="1">Amanhã</button>
  <button class="btn wine sm" type="button" data-a="puxar"${E.busy?' disabled':''}>${E.busy?'Buscando no SimpliRoute…':'Puxar do SimpliRoute'}</button>
  <label class="ck"><input type="checkbox" id="eini"${E.ini?' checked':''}> Enviar só iniciais dos pacientes</label>
  <span class="sp"></span><span class="upd">${E.srAt?'SimpliRoute lido às '+hh(E.srAt):''}${E.at?' · situação atualizada às '+hh(E.at):''}</span></div>`;
 if(E.err)h+=`<p class="err" role="alert">${esc(E.err)}</p>`;
 if(E.sr===null){h+=`<div class="empty">${E.busy?'Buscando as rotas no SimpliRoute…':'Escolha o dia e clique em <b>Puxar do SimpliRoute</b> para ver as rotas médicas.'}</div>`;return h+manuais([])}
 const L=E.sr.map(r=>{const e=estado(r),pf=e.d&&e.d.profissional_id?E.prof.find(p=>p.id===e.d.profissional_id):null;const auto=achaProf(r);const pid=(auto&&auto.id)||'';return{r,e,auto,pid:pid?+pid:'',ped:e.d?+e.d.pendentes:0}});
 const c={tot:L.length,nao:L.filter(x=>x.e.k==='nao').length,env:L.filter(x=>x.e.k==='env').length,vis:L.filter(x=>x.e.k==='vis').length,conf:L.filter(x=>x.e.k==='conf').length,mud:L.filter(x=>x.e.k==='mud').length,sem:L.filter(x=>!x.pid).length,ped:L.filter(x=>x.ped>0).length};
 h+=`<div class="resumo"><div class="kpi"><b>${c.tot}</b><span>rotas médicas</span></div><div class="kpi"><b>${c.env+c.vis+c.conf}</b><span>enviadas ao Minha Rota</span></div><div class="kpi"><b>${c.vis+c.conf}</b><span>vistas pelo profissional</span></div><div class="kpi"><b>${c.conf}</b><span>confirmadas</span></div></div>`;
 const F=[['','Todas',c.tot],['nao','Não enviadas',c.nao],['mud','Mudaram no SimpliRoute',c.mud],['env','Aguardando ver',c.env],['vis','Vistas',c.vis],['conf','Confirmadas',c.conf],['ped','Com pedido pendente',c.ped],['sem','Médico não cadastrado',c.sem]];
 const prontas=L.filter(x=>x.pid&&(x.e.k==='nao'||x.e.k==='mud'));
 h+=`<div class="bar"><div class="chips" role="group" aria-label="Filtrar rotas">${F.filter(f=>!f[0]||f[2]).map(f=>`<button type="button" data-ef="${f[0]}" class="${E.f===f[0]?'on':''}">${f[1]}<b>${f[2]}</b></button>`).join('')}</div><span class="sp"></span>${prontas.length?`<button class="btn sun sm" type="button" data-a="envtodas"${E.busy?' disabled':''}>Enviar ${prontas.length} ${prontas.length===1?'rota pronta':'rotas prontas'}</button>`:''}</div>`;
 if(E.semRota)h+=`<p class="upd">${E.semRota} ${E.semRota===1?'visita médica ainda não está':'visitas médicas ainda não estão'} em nenhuma rota no SimpliRoute.</p>`;
 const V=L.filter(x=>!E.f||(E.f==='sem'?!x.pid:E.f==='ped'?x.ped>0:x.e.k===E.f));
 if(!E.f)V.sort((a,b)=>(b.e.d?1:0)-(a.e.d?1:0)); // em Todas, as já enviadas primeiro
 if(!L.length)h+='<div class="empty">Nenhuma rota médica encontrada no SimpliRoute para este dia.</div>';
 else if(!V.length)h+='<div class="empty">Nenhuma rota com esse filtro.</div>';
 else{h+='<div class="grid">';V.forEach(x=>{const r=x.r,k=chave(r),d=x.e.d,st=x.e.k,pac=r.visitas;const prof=x.pid?E.prof.find(p=>p.id===x.pid):null;
  const nome=prof?prof.nome:(r.skill||'Profissional não identificado');const ini=pac.find(v=>v.hora&&v.hora!=='00:00');
  h+=`<article class="rt en s-${st}"><div class="enh"><div class="p"><b>${esc(nome)}</b><small>${esc(r.veiculo||'Sem veículo')}${r.motorista&&!casa(r.motorista,nome)?' · motorista '+esc(r.motorista):''}${prof&&prof.especialidade?' · '+esc(prof.especialidade):''}</small></div>
   <div class="stp">${st==='mud'?'<span class="st mud">Mudou no SimpliRoute</span>':''}<span class="st${d?' on':''}">${d?'Enviada '+hh(d.atualizado_em||d.publicado_em):'Não enviada'}</span><span class="st${d&&d.visto_em?' on':''}">${d&&d.visto_em?'Vista '+hh(d.visto_em):'Não vista'}</span><span class="st${d&&d.confirmado_em?' on':''}">${d&&d.confirmado_em?'Confirmada '+hh(d.confirmado_em):'Não confirmada'}</span>${x.ped?`<span class="st ped">${x.ped} ${x.ped===1?'pedido pendente':'pedidos pendentes'}</span>`:''}</div></div>
   <div class="inf"><span><b>${pac.length}</b> ${pac.length===1?'paciente':'pacientes'}</span>${ini?`<span>1ª visita <b>${esc(ini.hora)}</b></span>`:''}<span>${esc((r.tipos||[]).map(t=>TPV[t]||t).join(', '))}</span>${r.compartilhada&&r.compartilhada.length?`<span>carro dividido com ${esc(r.compartilhada.join(', '))}</span>`:''}</div>`;
  if(!x.auto){h+=`<div class="pick"><span>${r.skill?`<b>“${esc(r.skill)}”</b> não está cadastrado no Minha Rota. Cadastre em <b>Cadastros › Profissionais</b> com o mesmo nome do SimpliRoute para liberar o envio.`:'Rota sem médico no SimpliRoute: inclua o médico (skill) nas visitas para liberar o envio.'}</span></div>`}
  h+=`<details class="pl"><summary>Ver pacientes na ordem da rota</summary><ol>${pac.map(v=>`<li><i>${v.ordem}</i><em>${esc(v.hora&&v.hora!=='00:00'?v.hora:'—')}</em><span><b>${esc(E.ini?iniciais(v.nome):v.nome)}</b>${v.bairro?' · '+esc(v.bairro):''}</span></li>`).join('')}</ol></details>
   <div class="ena">${x.pid?`<button class="btn ghost sm" type="button" data-ver="${x.pid}">👁 Ver app</button>`:''}<small>${d?`Enviada por ${esc(d.publicado_por||'painel')} em ${hm(d.publicado_em)}${d.atualizado_em?' · reenviada '+hm(d.atualizado_em):''}`:'Ainda não está no app do profissional.'}</small>${st==='nao'||st==='mud'||(d&&+d.profissional_id!==+x.pid)?`<button class="btn ${st==='nao'?'wine':'sun'} sm" type="button" data-env="${esc(k)}"${x.pid?'':' disabled title="Médico não cadastrado no Minha Rota"'}>${st==='nao'?'Enviar para o Minha Rota':'Reenviar atualizada'}</button>`:'<span class="bd aprovada">Em dia com o SimpliRoute</span>'}</div></article>`});
  h+='</div>'}
 return h+manuais(E.sr.map(chave))}
function manuais(ks){const M=Object.values(E.db||{}).filter(d=>!ks.includes(d.placa));if(!M.length)return'';

 let hi=-1;for(let i=0;i<rows.length;i++){const r=rows[i].map(norm);if(r.includes('placa')&&r.includes('saldo')){hi=i;break}}
 if(hi<0)throw new Error('Não encontrei as colunas Placa e Saldo. Use o arquivo "Extrato Simplificado" exportado do portal da Ticket Log.');

 const num=v=>{v=String(v||'').replace(/[^\d,.-]/g,'');if(!v)return null;return +v.replace(/\./g,'').replace(',','.')};

  const cart=r[iC]||'';const st=(cart.match(/\(([A-Z])\)/)||[])[1]||'A';const dig=cart.replace(/\D/g,'');
  out.push({placa:pl,cartao_final:dig.slice(-4),status:st,modelo:iM>=0?r[iM]:null,reservado:iR>=0?num(r[iR]):null,limite:iL>=0?num(r[iL]):null,utilizado:iU>=0?num(r[iU]):null,saldo:num(r[iS])})}

 S.busy=true;S.err='';render();try{const r=await rpc('eq_trocar_pin',{p_token:S.token,p_atual:PIN_TMP,p_novo:pn});S.busy=false;
  if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo com o PIN provisório.');S.err=r.erro;render();return}
  S.trocar=false;PIN_TMP='';toast('PIN criado. Use ele nas próximas vezes.');render();carregar();if(S.tab==='env')carregarEnv(true);if(S.tab==='cad')carregarCad();if(S.tab==='evo')carregarEvoC();if(S.tab==='fro')carregarFrota()}catch(x){S.busy=false;S.err=x.message;render()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='flog')return;e.preventDefault();const cel=$('#cel').value,pin=$('#pin').value;if(!cel||!pin){S.err='Preencha o celular e o PIN.';render();return}
 S.busy=true;S.err='';render();try{const r=await rpc('eq_login',{p_celular:cel,p_pin:pin});S.busy=false;if(!r.ok){S.err=r.erro;render();$('#cel').value=cel;return}
  S.token=r.token;S.nome=r.nome;S.perfil=r.perfil||'logistica';try{sessionStorage.setItem('lg-token',r.token);sessionStorage.setItem('lg-nome',r.nome);sessionStorage.setItem('lg-perfil',S.perfil);marcaUso()}catch(x){}if(r.trocar_pin){S.trocar=true;PIN_TMP=pin;render();return}render();carregar()}catch(x){S.busy=false;S.err=x.message;render()}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-rs]');if(t)S.draft[t.dataset.rs]=t.value});
document.addEventListener('change',e=>{if(e.target.id==='fout'){F.outros=e.target.checked;render();return}if(e.target.id==='vso'){V.so=e.target.checked;V.ab=null;render();return}if(e.target.id==='edata'){E.data=e.target.value||hojeSP();E.sr=null;E.db=null;carregarEnv(true);return}if(e.target.id==='eini'){E.ini=e.target.checked;try{localStorage.setItem('lg-ini',E.ini?'1':'0')}catch(x){}render();return}if(e.target.dataset&&e.target.dataset.pick!==undefined){E.pick[e.target.dataset.pick]=e.target.value;render();return}if(e.target.id==='fesp'){S.f.esp=e.target.value;render()}if(e.target.id==='fdia'){S.f.dia=e.target.value;render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 try{
  if(d.a==='sair'){sair();return}
  if(d.a==='atualizar'){await carregar();toast('Atualizado.');return}
  if(d.tab){if(!LOGI()&&!podeTab(d.tab))return;S.cfgAb=false;S.tab=d.tab;SUBULT[grpDe(d.tab)]=d.tab;try{localStorage.setItem('lg-sub',JSON.stringify(SUBULT))}catch(x){}try{localStorage.setItem('lg-tab',d.tab)}catch(x){}render();if(d.tab==='env'&&E.sr===null)carregarEnv(true);if(d.tab==='cad')carregarCad(C.d!==null);if(/^mot/.test(d.tab))carregarMot(M.d!==null);if(d.tab==='evo'&&V.d===null)carregarEvoC();if(d.tab==='fro')carregarFrota(F.d!==null);if(d.tab==='can')carregarCanal();if(d.tab==='jan')carregarJan(JN.itens!==null);if(d.tab==='man'){carregarMan(MN.itens!==null);carregarMot(M.d!==null)}return}
  if(d.ced){C.ed=C.ed===d.ced?null:d.ced;C.pin=null;render();const i=document.querySelector(`[data-csave="${d.ced}"] input`);if(i)i.focus();return}
  if(d.cpin){C.pin=C.pin===d.cpin?null:d.cpin;C.ed=null;render();const i=document.querySelector(`[data-cpinok="${d.cpin}"] input`);if(i){i.focus();i.select()}return}
  if(d.cx!==undefined){C.ed=null;C.pin=null;render();return}
  if(d.cat){const {tipo,id,p}=cadAchar(d.cat);b.disabled=true;await cadRpc('eq_cad_ativo',{p_tipo:tipo,p_id:id,p_ativo:!p.ativo},p.nome+(p.ativo?' desativado. As sessões dele foram encerradas.':' reativado.'));return}
  if(d.mnovo){M.ed=M.ed==='novo'?null:'novo';M.pin=null;render();const i=document.querySelector('[data-msave=novo] input');if(i)i.focus();return}
  if(d.med){M.ed=M.ed===+d.med?null:+d.med;M.pin=null;render();const i=document.querySelector(`[data-msave="${d.med}"] input[name=cel]`);if(i)i.focus();return}
  if(d.mx!==undefined){M.ed=null;M.pin=null;M.qr=null;render();return}
  if(d.mqr){if(M.qr&&M.qr.id===+d.mqr){M.qr=null;render();return}b.disabled=true;try{const r=await fetch(SB+'/functions/v1/gps-qr',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token:S.token,motorista:+d.mqr})}).then(r=>r.json());if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');throw new Error(r.erro)}M.qr={id:+d.mqr,...r};M.pin=null;render()}catch(x){b.disabled=false;toast(x.message||'Não consegui gerar o QR.')}return}
  if(d.mcopy){try{await navigator.clipboard.writeText(d.mcopy);toast('Mensagem copiada.')}catch(x){toast('Não consegui copiar. Anote o PIN.')}return}
  if(d.ocvisto){b.disabled=true;await motRpc('eq_ocor_visto',{p_id:+d.ocvisto});toast('Marcada como recebida.');await carregarMot(true);return}
  if(d.mvisto){b.disabled=true;await motRpc('eq_mot_visto',{p_turno:+d.mvisto});toast('Marcado como ciente.');await carregarMot(true);return}
  if(d.mon||d.mpin){const id=+(d.mon||d.mpin),m=M.d.motoristas.find(x=>x.id===id);if(!m)return;
   if(d.mpin&&!confirm('Gerar um novo PIN para '+m.nome+'? O PIN atual deixa de valer e ele sai do app.'))return;b.disabled=true;
   if(d.mon)await motRpc('eq_mot_salvar',{p_id:id,p_nome:m.nome,p_celular:m.celular,p_geotab:m.geotab_id,p_sr:m.sr_id,p_ativo:true});
   const r=await motRpc('eq_mot_pin',{p_id:id});M.ed=null;M.pin={id,pin:r.pin};await carregarMot(true);toast(d.mon?'Acesso liberado.':'Novo PIN gerado.');return}
  if(d.moff){const id=+d.moff,m=M.d.motoristas.find(x=>x.id===id);if(!m||!confirm('Tirar o acesso de '+m.nome+' ao app?'))return;b.disabled=true;
   await motRpc('eq_mot_salvar',{p_id:id,p_nome:m.nome,p_celular:m.celular,p_geotab:m.geotab_id,p_sr:m.sr_id,p_ativo:false});M.pin=null;await carregarMot(true);toast('Acesso removido. '+m.nome.split(' ')[0]+' saiu do app.');return}
  if(d.a==='vrec'){await carregarEvoC();return}
  if(d.ver){const w=window.open('about:blank','_blank');try{const r=await rpc('eq_ver_como',{p_token:S.token,p_prof:+d.ver});if(!r.ok){if(w)w.close();if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');return toast(r.erro)}
   const u=new URL('./',location.href).href.replace(/\/central\/?$/,'/')+'#ver='+r.token;if(w)w.location.href=u;else location.href=u}catch(x){if(w)w.close();toast(x.message)}return}
  if(d.a==='frec'){await carregarFrota(true);return}
  if(d.fsel){F.sel=F.sel===d.fsel?null:d.fsel;F.fly=!!F.sel;render();return}
  if(d.a==='vcsv'){baixarEvoCSV();return}
  if(d.vab!=null){const x=(V.so?(V.d.medicos||[]).filter(m=>m.atrasadas>0):(V.d.medicos||[]))[+d.vab];V.ab=x&&V.ab!==x.profissional?x.profissional:null;render();return}
  if(d.a==='puxar'){await carregarEnv(true);if(!E.err)toast('Rotas do SimpliRoute atualizadas.');return}
  if(d.dia!==undefined){E.data=hojeSP(+d.dia);E.sr=null;E.db=null;await carregarEnv(true);return}
  if(d.ef!==undefined){E.f=d.ef;render();return}
  if(d.env){b.disabled=true;b.textContent='Enviando…';await enviarRota(d.env);toast('Rota enviada. O profissional já vê no Minha Rota.');return}
  if(d.a==='envtodas'){b.disabled=true;const ks=(E.sr||[]).filter(r=>{const e=estado(r);const a=achaProf(r);return a&&(e.k==='nao'||e.k==='mud')}).map(chave);let ok=0,er=[];for(const k of ks){b.textContent='Enviando '+(ok+er.length+1)+' de '+ks.length+'…';try{await enviarRota(k,true);ok++}catch(x){er.push(k)}}await carregarEnv(false,true);toast(ok+' '+(ok===1?'rota enviada':'rotas enviadas')+(er.length?' · '+er.length+' com erro':'')+'.');return}
  if(d.st!==undefined){S.f.st=d.st;render();return}
  if(d.tg){S.open[d.tg]=b.getAttribute('aria-expanded')!=='true';render();return}
  if(d.ok){b.disabled=true;await responder(d.ok,'aprovada',S.draft[d.ok]);toast('Aprovada. O profissional já vê no app.');return}
  if(d.no){if(!(S.draft[d.no]||'').trim()){toast('Para recusar, escreva o motivo na resposta.');const i=document.querySelector(`[data-rs="${d.no}"]`);if(i)i.focus();return}b.disabled=true;await responder(d.no,'recusada',S.draft[d.no]);toast('Recusada. O profissional já vê no app.');return}
  if(d.ap){b.disabled=true;await responder(d.ap,'aplicada');toast('Marcada como aplicada.');return}
  if(d.re){b.disabled=true;await responder(d.re,'pendente');toast('Solicitação reaberta.');return}
  if(d.all){b.disabled=true;const ids=d.all.split(',');for(const id of ids)await responder(id,'aprovada',S.draft[id],true);await carregar(true);toast(ids.length+' pedidos aprovados.');return}
 }catch(x){b.disabled=false;toast(x.message)}});
setInterval(()=>{try{if(!EMBED&&S.token&&Date.now()-(+sessionStorage.getItem('lg-ult')||0)>INATIVO_MIN*6e4){sair('Por segurança, a sessão foi encerrada após '+INATIVO_MIN+' minutos sem uso. Entre de novo.');return}}catch(e){}if(S.token&&!document.hidden&&!document.querySelector('[data-rs]:focus,select:focus')){carregar(true);if(LOGI())carregarLoc(true);if(LOGI()&&(isMot()||S.tab==='man'||Date.now()-M.at>120e3))carregarMot(true);if(S.tab==='man'&&LOGI())carregarMan(true);if(S.tab==='env'&&(E.sr!==null||!LOGI())&&!E.busy)carregarEnv(false,true);if(!K.busy)carregarCanal(true)}},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden||!S.token)return;try{if(!EMBED&&Date.now()-(+sessionStorage.getItem('lg-ult')||0)>INATIVO_MIN*6e4)return sair('Por segurança, a sessão foi encerrada após '+INATIVO_MIN+' minutos sem uso. Entre de novo.')}catch(e){}carregar(true)});
function iniciarCarga(){if(!S.token)return;carregar();if(LOGI()){if(pushSupC()&&!PUSHC_ok){PUSHC_ok=true;pushChecarC()}carregarMot(S.tab!=='mot');carregarCanal(S.tab!=='can')}if(S.tab==='env')carregarEnv(true);if(S.tab==='cad')carregarCad();if(S.tab==='evo')carregarEvoC();if(S.tab==='fro')carregarFrota();if(S.tab==='jan')carregarJan();if(S.tab==='man')carregarMan();if(LOGI())carregarLoc(true)}
if(EMBED){addEventListener('message',e=>{if(e.origin!==PAINEL_ORIGEM||!e.data||e.data.tipo!=='central-login')return;const d=e.data;if(!/^[a-f0-9]{20,}$/.test(String(d.token||'')))return;
  const novo=S.token!==d.token;S.token=d.token;S.nome=d.nome||'';S.perfil='logistica';S.trocar=false;try{sessionStorage.setItem('lg-token',S.token);sessionStorage.setItem('lg-nome',S.nome);sessionStorage.setItem('lg-perfil','logistica');sessionStorage.setItem('lg-ult',String(Date.now()))}catch(x){}
  if(d.tab&&['sol','env','aju','fro','evo','mot','motf','man','motc','motv','mota','cad','can','jan'].includes(d.tab)){S.tab=d.tab==='mot'?'motf':d.tab}if(novo){render();iniciarCarga()}else render()});
 avisaPainel({tipo:'central-pronto'})}
render();iniciarCarga();
setInterval(()=>{if(S.token&&!S.trocar&&S.tab==='fro'&&!document.hidden&&Date.now()-F.at>55e3)carregarFrota(true)},15000);
