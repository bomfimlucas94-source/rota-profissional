<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5f0040">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon_1.png">
<title>Minha Rota · Motorista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#5f0040;--wine-d:#3a0026;--sun:#fbb040;--peach:#f2d1a0;--warm:#d7d2cb;--bg:#f7f5f1;--ink:#2b0a1f;--muted:#6d5d64;--line:#e4ddd6;--ok:#1d6b3a;--ok-bg:#dff3e5;--pend:#7a4300;--pend-bg:#fff0d6;--bad:#8f1d2b;--bad-bg:#fbe2e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{background:var(--wine);color:#fff;padding:18px 18px 20px;padding-top:max(18px,env(safe-area-inset-top))}
.top .k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);display:flex;justify-content:space-between;align-items:center}
.top .k button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;font-size:12px;font-weight:700;padding:6px 12px;min-height:32px;cursor:pointer}
.top h1{margin:8px 0 2px;font-size:22px;font-weight:800}
.top p{margin:0;color:var(--peach);font-size:13.5px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps li{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:var(--peach)}
.steps li i{height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.steps li.on{color:#fff;font-weight:800}.steps li.on i{background:var(--sun)}
.steps li.ok i{background:var(--sun);opacity:.6}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}
.btn.sun{background:var(--sun);color:var(--wine-d)}.btn.wine{background:var(--wine);color:#fff}
.btn.line{background:#fff;color:var(--wine);border:1px solid var(--warm);font-size:14px;min-height:46px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.cp{display:flex;gap:8px;align-items:center}.cp code{flex:1;min-width:0;overflow-wrap:anywhere;background:#f4efe9;border-radius:10px;padding:10px;font-size:13px}.cp button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--wine)}
.msg{border-radius:12px;padding:12px;font-size:13.5px;line-height:1.45}
.msg.ok{background:var(--ok-bg);color:#12432a}.msg.pend{background:var(--pend-bg);color:#4a2a00;border:1px solid #f0c98a}.msg.bad{background:var(--bad-bg);color:#6d1420;border:1px solid #f0b8bf}
.err{background:var(--bad-bg);color:#6d1420;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0}
.carro{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px;cursor:pointer;color:var(--ink)}
.carro b{font-size:17px;letter-spacing:.04em}.carro small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.carro .tag{margin-left:auto;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.tag.perto{background:var(--ok-bg);color:var(--ok)}.tag.ult{background:var(--pend-bg);color:var(--pend)}.tag.longe{background:#efeae4;color:var(--muted)}
.busca{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.busca input,.obs textarea{border:1px solid var(--warm);border-radius:10px;padding:12px;font-size:16px;color:var(--ink);min-height:46px;background:#fff;width:100%}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;display:flex;flex-direction:column;gap:8px}
.item.prob{border:2px solid var(--bad)}
.item .l{display:flex;align-items:center;gap:8px}
.item .n{flex:1;font-size:14.5px;font-weight:700}.item .n small{display:block;font-size:11px;color:var(--bad);font-weight:700}
.sel{font-size:13px;font-weight:700;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--warm);background:#fff;color:var(--ink);cursor:pointer}
.sel.okon{background:var(--ok);border-color:var(--ok);color:#fff}.sel.probon{background:var(--bad);border-color:var(--bad);color:#fff}
.obs{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.obs textarea{min-height:64px;resize:vertical;font-size:15px}
.sec{font-size:18px;font-weight:800;margin:2px 0 0}
.meta{font-size:12.5px;color:var(--muted);margin:0}
.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.login{padding:32px 20px;display:flex;flex-direction:column;gap:16px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.login input{border:1px solid var(--warm);border-radius:10px;padding:12px;font-size:16px;min-height:48px}
.dl{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dl li{font-size:13.5px;display:flex;gap:8px}
.chk{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:800}
.chk.w{background:var(--pend)}.chk.r{background:var(--bad)}
dialog{border:0;border-radius:18px;padding:20px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(43,10,31,.45)}
dialog h3{margin:0 0 8px;font-size:18px}dialog p{margin:0 0 14px;font-size:14px;line-height:1.45}
dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--wine-d);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.carregando{color:var(--muted);font-size:14px;text-align:center;padding:24px 0}
.fotobtn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--wine);background:#fff;border:1px dashed var(--warm);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer}
.fotobtn input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{display:flex;align-items:center;gap:10px}.thumb img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{background:none;border:0;color:var(--bad);font-weight:700;font-size:13px;min-height:44px;cursor:pointer}
.rota{display:flex;flex-direction:column;gap:8px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap;background:#efeae4;color:var(--muted)}
.pill.and{background:var(--pend-bg);color:var(--pend)}.pill.fim{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.vis{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.vis.atual{border:2px solid var(--wine)}
.vis .l{display:flex;gap:10px;align-items:flex-start}
.vis .o{width:26px;height:26px;border-radius:50%;background:#efeae4;color:var(--wine);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.vis .o.ok{background:var(--ok);color:#fff}.vis .o.bad{background:var(--bad);color:#fff}
.vis .t{flex:1;min-width:0}.vis .t b{display:block;font-size:14.5px}.vis .t small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.vis .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vis .acts .btn{min-height:44px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border-radius:12px;border:1px solid var(--warm);background:#fff;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true].c{background:var(--ok);border-color:var(--ok);color:#fff}.seg button[aria-pressed=true].f{background:var(--bad);border-color:var(--bad);color:#fff}
.mot{display:flex;flex-direction:column;gap:6px}
.mot label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px;font-size:14.5px;cursor:pointer}
.mot input{width:20px;height:20px;accent-color:var(--wine)}
.ass{border:1px solid var(--warm);border-radius:12px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.wrap.comnav{padding-bottom:76px}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
nav.nav button{background:none;border:0;min-height:62px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
nav.nav button svg{width:22px;height:22px}
nav.nav button[aria-current=page]{color:var(--wine)}
nav.nav b{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bubs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.bub.eu{align-self:flex-end;background:var(--wine);color:#fff;border-color:var(--wine)}
.bub.cen{background:var(--pend-bg);border-color:#f0c98a}
.bub small{display:block;font-size:11px;margin-top:3px;opacity:.75}
.chatfoot{position:sticky;bottom:76px;background:var(--bg);padding:8px 16px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--warm);background:#fff;border-radius:999px;font-size:13px;font-weight:700;color:var(--wine);min-height:40px;padding:0 12px;cursor:pointer;white-space:nowrap}
.chips button.ed{color:var(--muted);border-style:dashed}
.envia{display:flex;gap:8px}.envia input{flex:1;border:1px solid var(--warm);border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px;background:#fff}
.envia button{min-height:46px;border-radius:12px;border:0;background:var(--wine);color:#fff;font-weight:800;padding:0 16px;cursor:pointer}
.envia button:disabled{background:var(--line);color:var(--muted)}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tipos button{min-height:52px;border-radius:12px;border:1px solid var(--warm);background:#fff;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.tipos button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.campo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.campo input,.campo textarea{border:1px solid var(--warm);border-radius:10px;padding:12px;font-size:16px;color:var(--ink);min-height:46px;background:#fff;width:100%}
.campo textarea{min-height:72px;resize:vertical}
.ck{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px}.ck input{width:22px;height:22px;accent-color:var(--wine)}
.oc{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}.oc:first-of-type{border-top:0}
.oc .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rsp{display:flex;gap:6px;align-items:center}.rsp input{flex:1;border:1px solid var(--warm);border-radius:10px;padding:10px 12px;font-size:16px;min-height:46px}
.rsp button{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:16px;cursor:pointer;color:var(--wine)}
.rsp button:disabled{opacity:.35}
.fdia{font-size:26px;font-weight:800;color:var(--wine)}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dgrid button{min-height:56px;border-radius:12px;border:1px solid var(--warm);background:#fff;color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dgrid button small{font-size:11px;font-weight:600;color:var(--muted)}
.dgrid button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}.dgrid button[aria-pressed=true] small{color:var(--peach)}
.dgrid button:disabled{background:#efeae4;color:#b9aeb3;border-color:#efeae4;cursor:default}.dgrid button.atual{border:2px dashed var(--wine);color:var(--wine)}
.link{background:none;border:0;color:var(--wine);font-weight:700;font-size:13px;padding:0;min-height:32px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgP"></p><div class="row"><button class="btn line" id="dlgN" type="button">Cancelar</button><button class="btn wine" id="dlgS" type="button">Confirmar</button></div></dialog>
<script>
const SB='https://sizbevhqreaccxrlimup.supabase.co',KEY='sb_publishable_sOPBmFvZMrGj3JvHzxIyYQ_4LsvUbSG';
const S={token:null,nome:'',trocar:false,etapa:'carregando',turno:null,lista:null,carros:null,gps:null,busca:'',sec:0,resp:{},busy:false,err:'',rotas:null,motivos:[],rotaErr:'',vis:null,co:null,aba:'hoje',naoLidas:0,fg:{d:null,err:'',sel:{},mot:{}},
 chat:{rotas:null,rota:null,msgs:[],resp:[],txt:'',err:'',ed:null,n:-1},oc:{lista:null,tipo:'',texto:'',valor:'',foto:null,avisar:true,err:''}};
try{S.token=localStorage.getItem('rm-token');S.nome=localStorage.getItem('rm-nome')||'';S.trocar=localStorage.getItem('rm-trocar')==='1'}catch(e){}
let PIN_TMP='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>t?new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const km=m=>m==null?'':m<1000?'a '+m+' m':'a '+(m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),Math.max(3200,t.length*70))}
async function rpc(fn,args){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error('Falha de conexão. Tente de novo.');const t=await r.text();return t?JSON.parse(t):null}
async function api(acao,extra,fn){const r=await fetch(SB+'/functions/v1/'+(fn||'motorista'),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token:S.token,acao,...(extra||{})})});
 if(!r.ok)throw new Error('Falha de conexão ('+r.status+'). Tente de novo.');const j=await r.json();if(!j.ok&&j.erro==='sessao'){sair('Sua sessão expirou. Entre de novo.');throw new Error('sessao')}return j}
function confirma(t,p,sim){return new Promise(ok=>{const d=$('#dlg');$('#dlgT').textContent=t;$('#dlgP').textContent=p;$('#dlgS').textContent=sim||'Confirmar';d.showModal();
 const fim=v=>{d.close();$('#dlgS').onclick=null;$('#dlgN').onclick=null;ok(v)};$('#dlgS').onclick=()=>fim(true);$('#dlgN').onclick=()=>fim(false)})}
function sair(msg){try{if(S.token)rpc('mot_sair',{p_token:S.token}).catch(()=>{});localStorage.removeItem('rm-token');localStorage.removeItem('rm-trocar')}catch(e){}
 S.token=null;S.turno=null;S.err=msg||'';location.href='index.html'+(msg?'#msg='+encodeURIComponent(msg):'')}
function pegaGps(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);let fim=false;const t=setTimeout(()=>{if(!fim){fim=true;ok(null)}},9000);
 navigator.geolocation.getCurrentPosition(p=>{if(!fim){fim=true;clearTimeout(t);ok({lat:p.coords.latitude,lng:p.coords.longitude})}},()=>{if(!fim){fim=true;clearTimeout(t);ok(null)}},{enableHighAccuracy:true,timeout:8000,maximumAge:60000})})}
function fotoComp(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.72))};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Não consegui ler a foto.'))};im.src=u})}
const fotoCampo=(chave,foto)=>foto?`<div class="thumb"><img src="${foto}" alt="Foto anexada"><button type="button" data-a="tirafoto" data-k="${esc(chave)}">Remover foto</button></div>`
 :`<label class="fotobtn"><input type="file" accept="image/*" capture="environment" data-foto="${esc(chave)}">📷 Tirar foto (opcional)</label>`;
async function carregaRota(){S.rotaErr='';try{const r=await api('rota');if(!r.ok){S.rotaErr=r.erro;S.rotas=[]}else{S.rotas=r.rotas||[];S.motivos=r.motivos||[]}}
 catch(e){if(e.message==='sessao')return;S.rotaErr=e.message;S.rotas=[]}if(S.etapa==='pronto')render()}
async function carregaTicket(){try{const r=await rpc('mot_ticket',{p_token:S.token});if(r&&r.ok){S.tk=r;if(S.etapa==='pronto'&&S.aba==='hoje')render()}}catch(e){}}
setInterval(()=>{if(S.token&&S.etapa==='pronto'&&!document.hidden)carregaTicket()},10*60000);
const brl=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function tkHtml(){const k=S.tk;if(!k||!k.cartao)return'';
 const at=new Date(k.atualizado_em),hj=at.toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'})===new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
 const quando=(hj?'hoje':at.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'}))+' às '+at.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
 const bloq=k.status&&k.status!=='A';
 return `<div class="card" style="gap:6px"><h2>Cartão Ticket Log</h2><span style="font-size:26px;font-weight:800;color:${bloq||k.baixo?'#8a1c2b':'inherit'}">${brl(k.saldo)}</span>
  <p class="meta">Saldo do cartão do ${esc(k.placa)}${k.final?' · final '+esc(k.final):''} · atualizado ${quando}${hj?'':' (pode estar desatualizado)'}</p>
  ${bloq?`<div class="msg bad" role="alert"><b>Cartão bloqueado.</b> Fale com a Logística antes de abastecer.</div>`:k.baixo?`<div class="msg pend" role="alert"><b>Saldo baixo</b> (abaixo de ${brl(k.minimo||100)}). Avise a Logística antes de precisar abastecer.</div>`:''}
  ${+k.reservado?`<p class="meta">Há ${brl(k.reservado)} reservado de uma compra em andamento.</p>`:''}</div>`}
// ===== Terceirizado: carro próprio, sem Geotab; localização pelo celular (app Traccar Client) =====
const TERC=()=>S.tipo==='terceiro';
const GPS_URL='https://sizbevhqreaccxrlimup.supabase.co/functions/v1/gps';
S.g={codigo:'',ultima_em:null,ultima_fonte:null,at:0};

   toast('Ocorrência enviada à Central'+(r.avisou?' e ao profissional':'')+'.');if(O.foto&&r.foto===false)setTimeout(()=>toast('A foto não foi enviada.'),3300);
   S.oc={lista:O.lista,tipo:'',texto:'',valor:'',foto:null,avisar:true,err:''};render();scrollTo(0,0);carregaOcor()}
  catch(x){S.busy=false;if(x.message!=='sessao'){O.err=x.message;render()}}return}
 if(a==='copia'){try{await navigator.clipboard.writeText(b.dataset.copia);toast('Copiado.')}catch(x){toast('Não consegui copiar. Segure o texto para copiar.')}return}
 if(a==='logout'){if(S.turno&&!S.turno.saiu_em&&!(await confirma('Sair do app?','Você continua registrado no carro. Para sair do carro, use "Encerrar plantão".','Sair do app')))return;sair();return}
 if(a==='recarregar'){S.err='';iniciar();return}
 if(a==='gps'){carregaCarros();return}
 if(a==='escolher'){const c=(S.carros||[]).find(x=>x.id===b.dataset.id);if(!c)return;
  const longe=c.distancia_m!=null&&c.distancia_m>500;
  if(!(await confirma('Entrar no '+c.placa+'?',longe?'Pelo Geotab, este carro está '+km(c.distancia_m)+' de você. Confirme só se tiver certeza de que é o carro certo.':'O app vai registrar você neste carro no Geotab. Você não precisa abrir o MyGeotab Drive.','Entrar no carro')))return;
  S.busy=true;S.err='';render();
  try{const r=await api('entrar',{device:c.id,...(S.gps||{})});S.busy=false;if(!r.ok){S.err=r.erro;render();return}
   S.turno=r.turno;S.lista=r.checklist;S.resp={};S.sec=0;S.etapa='inspecao';toast('Você entrou no carro '+c.placa+'.');render();scrollTo(0,0)}
  catch(x){S.busy=false;if(x.message!=='sessao'){S.err=x.message;render()}}return}
 if(a==='tirafoto'){const k=b.dataset.k;if(k==='o')S.oc.foto=null;else if(k==='v')S.co.foto=null;else if(S.resp[k.slice(2)])delete S.resp[k.slice(2)].foto;render();return}
 if(a==='rotarec'){S.rotas=null;render();carregaRota();return}
 if(a==='riniciar'){if(!(await confirma('Iniciar a rota?','O app avisa o SimpliRoute que você saiu para a rota.','Iniciar')))return;await acaoRota('rota_iniciar',{rota:b.dataset.r},'Rota iniciada. Boa rota!');return}
 if(a==='rfinalizar'){const r=(S.rotas||[]).find(x=>x.id===b.dataset.r);const falta=r?r.visitas.filter(v=>v.status!=='completed'&&v.status!=='failed').length:0;
  if(!(await confirma('Finalizar a rota?',falta?'Ainda há '+falta+(falta>1?' visitas abertas':' visita aberta')+'. Finalize mesmo assim só se a Logística tiver combinado. Só é possível finalizar com o carro na base.':'Todas as visitas foram finalizadas. Só é possível finalizar com o carro de volta na base.','Finalizar rota')))return;await acaoRota('rota_finalizar',{rota:b.dataset.r},'Rota finalizada.');return}
 if(a==='checkin'){await acaoRota('checkin',{visita:b.dataset.v},'Chegada registrada.');return}
 if(a==='fvisita'){const v=(S.rotas||[]).flatMap(r=>r.visitas).find(x=>String(x.id)===b.dataset.v);if(!v)return;S.vis=v;S.co={status:'',motivo:'',comentario:'',foto:null,assImg:null,assinou:false};S.err='';S.etapa='visita';render();scrollTo(0,0);return}
 if(a==='cost'){S.co.status=b.dataset.s;if(S.co.status!=='failed')S.co.motivo='';S.err='';render();return}
 if(a==='limpass'){S.co.assImg=null;S.co.assinou=false;render();return}
 if(a==='vvoltar'){S.etapa='pronto';S.vis=null;S.err='';render();return}
 if(a==='venviar'){const c=S.co;if(!c.status||(c.status==='failed'&&!c.motivo))return;
  const mo=S.motivos.find(m=>m.id===c.motivo);if(c.status==='failed'&&mo&&/outro/i.test(mo.nome)&&!c.comentario.trim()){S.err='Conte no comentário o que houve.';render();return}
  const r=await acaoRota('checkout',{visita:S.vis.id,status:c.status,motivo:c.motivo||undefined,comentario:c.comentario,foto:c.foto||undefined,assinatura:c.status==='completed'&&c.assImg?c.assImg:undefined});
  if(r){toast(c.status==='completed'?'Visita finalizada.':'Visita registrada como não realizada.');if(c.foto&&r.foto===false)toast('A foto não foi enviada. Avise a logística se ela for importante.');S.etapa='pronto';S.vis=null;S.co=null;render();scrollTo(0,0)}return}
 if(a==='ok'){S.resp[b.dataset.id]={ok:true};S.err='';render();return}
 if(a==='prob'){S.resp[b.dataset.id]={ok:false,obs:(S.resp[b.dataset.id]&&S.resp[b.dataset.id].obs)||''};render();const t=document.querySelector(`[data-obs="${CSS.escape(b.dataset.id)}"]`);if(t)t.focus();return}
 if(a==='proxima'){if(!secCompleta(S.sec))return;S.sec++;render();scrollTo(0,0);return}
 if(a==='voltar'){S.sec=Math.max(0,S.sec-1);render();scrollTo(0,0);return}
 if(a==='enviar'){if(!S.lista.every((s,i)=>secCompleta(i)))return;
  const np=Object.values(S.resp).filter(r=>r.ok===false).length;
  if(!(await confirma('Enviar inspeção?',np?'Você marcou '+np+(np>1?' problemas':' problema')+'. A logística e a manutenção vão ver no Geotab.':'Todos os itens OK.','Enviar')))return;
  S.busy=true;S.err='';render();
  try{const r=await api('inspecao',{respostas:S.resp});S.busy=false;if(!r.ok){S.err=r.erro;render();return}
   S.turno=r.turno;S.etapa='pronto';toast('Inspeção registrada no Geotab.');if(r.fotos_falharam&&r.fotos_falharam.length)setTimeout(()=>toast('Não consegui enviar a foto de: '+r.fotos_falharam.join(', ')+'. O problema foi registrado mesmo assim.'),3400);render();scrollTo(0,0);carregaRota();carregaTicket()}
  catch(x){S.busy=false;if(x.message!=='sessao'){S.err=x.message;render()}}return}
 if(a==='tiniciar'){S.busy=true;S.err='';render();const g=await pegaGps();
  try{const r=await api('entrar',g||{});S.busy=false;if(!r.ok){S.err=r.erro;render();return}S.turno=r.turno;S.etapa='pronto';toast('Plantão iniciado.');render();scrollTo(0,0);carregaRota();carregaGps()}
  catch(x){S.busy=false;if(x.message!=='sessao'){S.err=x.message;render()}}return}
 if(a==='gpsver'){toast('Verificando…');await carregaGps();const u=S.g.ultima_em?new Date(S.g.ultima_em):null;toast(u&&S.g.ultima_fonte==='traccar'&&Date.now()-u<10*6e4?'Localização chegando. Tudo certo!':S.turno?'Ainda não chegou posição do Traccar Client. Confira os passos.':'Inicie o plantão e depois verifique: fora do plantão a posição não é guardada.');return}
 if(a==='encerrar'){const ab=(S.rotas||[]).some(r=>r.status==='started');if(!(await confirma('Encerrar o plantão?',(ab?'Sua rota ainda está em andamento no SimpliRoute. ':'')+(TERC()?'A localização deixa de ser usada.':'O app tira você do carro '+(S.turno?S.turno.placa:'')+' no Geotab.'),'Encerrar')))return;
  S.busy=true;render();
  try{const r=await api('sair');S.busy=false;if(!r.ok){toast(r.erro);return}toast('Plantão encerrado. Bom descanso!');S.turno=null;S.lista=null;S.resp={};S.etapa='carro';render();if(!TERC())carregaCarros()}
  catch(x){S.busy=false;if(x.message!=='sessao')toast(x.message)}return}
});
function avisaPush(id){fetch(SB+'/functions/v1/push-chat',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token:S.token,msg:id})}).catch(()=>{})}
async function contaRotas(){try{const r=await rpc('mot_chat',{p_token:S.token,p_ler:false});if(r&&r.ok){S.chat.rotas=r.rotas;if(S.aba==='ocor')render()}}catch(e){}}
async function enviaChat(t,pronta){t=String(t||'').trim();if(!t||S.busy||!S.chat.rota)return;S.busy=true;
 try{const r=await rpc('mot_chat_enviar',{p_token:S.token,p_rota:S.chat.rota,p_texto:t,p_pronta:!!pronta});S.busy=false;
  if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo.');toast(r.erro);render();return}
  if(!pronta)S.chat.txt='';S.chat.msgs=r.msgs;S.chat.n=r.msgs.length;render();fimChat();avisaPush(r.id);if(!pronta){const i=$('#ctxt');if(i)i.focus()}}
 catch(x){S.busy=false;toast(x.message);render()}}
document.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='fchat'){enviaChat(S.chat.txt,false);return}
 if(e.target.id==='fpin'){const pa=PIN_TMP||($('#pa')?$('#pa').value:''),pn=$('#pn').value,pn2=$('#pn2').value;
  if(!pa||!pn){S.err='Preencha os campos.';render();return}if(pn!==pn2){S.err='Os dois PINs novos não são iguais.';render();return}
  S.busy=true;S.err='';render();
  try{const r=await rpc('mot_trocar_pin',{p_token:S.token,p_atual:pa,p_novo:pn});S.busy=false;
   if(!r.ok){if(r.erro==='sessao')return sair('Sua sessão expirou. Entre de novo com o PIN provisório.');S.err=r.erro;render();return}
   S.trocar=false;PIN_TMP='';try{localStorage.removeItem('rm-trocar')}catch(x){}toast('PIN criado. Use ele nas próximas vezes.');iniciar()}
  catch(x){S.err=x.message;S.busy=false;render()}}});
try{PIN_TMP=sessionStorage.getItem('rm-pin-tmp')||'';sessionStorage.removeItem('rm-pin-tmp')}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
// todo dia à meia-noite (00:00) o app desconecta o motorista (o servidor também encerra as sessões e tira do carro no Geotab)
const ABERTO_EM=new Date();
function corte00(){const c=new Date(ABERTO_EM);c.setHours(24,0,0,0);return c}
setInterval(()=>{if(!S.token)return;const c=corte00();if(new Date()>=c){S.token=null;try{localStorage.removeItem('rm-token');localStorage.removeItem('rm-trocar')}catch(e){}location.href='index.html#msg='+encodeURIComponent('O app desconecta todos os motoristas à meia-noite. Se ainda estiver em serviço, entre de novo.')}},30000);
let tick=0;setInterval(()=>{if(!S.token||document.hidden||!comNav())return;tick++;
 if(S.aba==='chat'){if(!S.busy)carregaChat(true)}
 else if(tick%3===0)contaNaoLidas()},10000);
setTimeout(()=>{if(S.token&&comNav())contaNaoLidas()},2500);
</script>
