<script>
const SB='https://sizbevhqreaccxrlimup.supabase.co',KEY='sb_publishable_sOPBmFvZMrGj3JvHzxIyYQ_4LsvUbSG';
const S={hj:{rotas:null,at:0,busy:false,err:'',aberto:true},tplaca:'',lg:{msgs:null,nl:0,txt:'',err:''},am:{rotas:null,at:0,busy:false,err:'',aberto:false},alvo:'',token:null,nome:'',trocar:false,etapa:'carregando',turno:null,lista:null,carros:null,gps:null,busca:'',sec:0,resp:{},busy:false,err:'',rotas:null,motivos:[],rotaErr:'',vis:null,co:null,aba:'hoje',naoLidas:0,fg:{d:null,err:'',sel:{},mot:{}},
 chat:{rotas:null,rota:null,msgs:[],resp:[],txt:'',err:'',ed:null,n:-1},oc:{lista:null,tipo:'',texto:'',valor:'',foto:null,avisar:true,err:''}};
try{S.token=localStorage.getItem('rm-token');S.nome=localStorage.getItem('rm-nome')||'';S.trocar=localStorage.getItem('rm-trocar')==='1'}catch(e){}
/* visualização da Logística: aberta pela Central com #ver=token (só leitura, 30 min); não mexe no login do motorista deste aparelho */
try{const m=location.hash.match(/^#ver=([0-9a-f]{20,})$/);if(m){sessionStorage.setItem('rm-ver',m[1]);history.replaceState(null,'',location.pathname+location.search)}
 const v=sessionStorage.getItem('rm-ver');if(v){S.token=v;S.leitura=true;S.trocar=false;S.nome='';document.documentElement.classList.add('leitura')}}catch(e){}

async function rpc(fn,args){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error('Falha de conexão. Tente de novo.');const t=await r.text();return t?JSON.parse(t):null}

 try{if(S.token)rpc('mot_sair',{p_token:S.token}).catch(()=>{});localStorage.removeItem('rm-token');localStorage.removeItem('rm-trocar')}catch(e){}
 S.token=null;S.turno=null;S.err=msg||'';location.href='index.html'+(msg?'#msg='+encodeURIComponent(msg):'')}
function gps1(o,ms){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);let fim=false;const t=setTimeout(()=>{if(!fim){fim=true;ok(null)}},ms);
 navigator.geolocation.getCurrentPosition(p=>{if(!fim){fim=true;clearTimeout(t);ok({lat:p.coords.latitude,lng:p.coords.longitude,prec:Math.round(p.coords.accuracy||0)||null})}},()=>{if(!fim){fim=true;clearTimeout(t);ok(null)}},o)})}
/* sem GPS (ex.: estacionamento subterrâneo): tenta a posição por Wi-Fi/rede e, por último, a última posição guardada (até 15 min) */

function abreLoc(v,aviso){S.vis=v;S.loc={g:null,nota:'',aviso:aviso||'',buscando:true,w:null};S.err='';S.etapa='loc';render();scrollTo(0,0);buscaLoc()}
function buscaLoc(){const L=S.loc;if(!L)return;paraLoc();L.buscando=true;render();if(!navigator.geolocation){L.buscando=false;render();return}
 L.w=navigator.geolocation.watchPosition(p=>{const g={lat:p.coords.latitude,lng:p.coords.longitude,prec:Math.round(p.coords.accuracy||0)||null};if(!L.g||!g.prec||!L.g.prec||g.prec<=L.g.prec)L.g=g;L.buscando=false;if(S.etapa==='loc'&&document.activeElement?.id!=='locnota')render()},()=>{L.buscando=false;if(S.etapa==='loc')render()},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 L.t=setTimeout(paraLoc,30000)}
function paraLoc(){const L=S.loc;if(L&&L.w!=null){navigator.geolocation.clearWatch(L.w);L.w=null}if(L&&L.t){clearTimeout(L.t);L.t=null}}
function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dg=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))}
async function pegaGps(){return (await gps1({enableHighAccuracy:true,timeout:8000,maximumAge:60000},9000))||(await gps1({enableHighAccuracy:false,timeout:5000,maximumAge:900000},6000))}
function fotoComp(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.72))};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Não consegui ler a foto.'))};im.src=u})}

function profDaVisita(v){const f=(S.campos||[]).find(x=>x.key==='nome_profissional');const n=String(v.obs||'').split('|')[1]||'';return f?(f.options.find(o=>nzP(o)===nzP(n))||''):''}
function tipoVisita(v){if(v.tipo)return v.tipo;const p=profDaVisita(v);return /^\s*dra?\b/i.test(p)?'med_visit':/^\s*enf/i.test(p)?'enf_visit':''}

function motivoDe(txt){const t=nzP(txt),M=S.motivos||[],ach=re=>M.find(m=>re.test(nzP(m.nome)));
 const m=/ausente/.test(t)?ach(/ausente/):/endereco/.test(t)?ach(/endereco/):/recusa/.test(t)?ach(/recus/):/hospital|internad|instabilidade/.test(t)?ach(/internad|hospital/):/conflito|policial/.test(t)?ach(/acesso|bloque/):null;
 return m||ach(/outro/)||M[M.length-1]}

 if(S.aba==='chat'){if(!S.busy){if(S.alvo==='log')carregaLog(true);else carregaChat(true)}if(tick%3===0){if(S.alvo==='log')contaNaoLidas();else contaLog()}}
 else if(tick%3===0){contaNaoLidas();contaLog()}},10000);
setTimeout(()=>{if(S.token&&comNav()){contaNaoLidas();contaLog()}},2500);
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('amanha'))S.am.aberto=e.target.open;if(e.target.classList&&e.target.classList.contains('hojepv'))S.hj.aberto=e.target.open},true);
document.addEventListener('input',e=>{if(e.target&&e.target.id==='tplaca')S.tplaca=e.target.value});

/* Notificações no celular do motorista: mensagens da Logística, avisos e conversa da rota */
const VAPID='BJtcxQcuxJz_-k4vrCm9Wh9J5pkCLa7dSDPlCxN4gdvtf-hXwyUIchWSVV4G3cUGHYCZtmLTrZaPtK57gizWNVs';
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol==='https:';
const ehIOSm=/iphone|ipad|ipod/i.test(navigator.userAgent),instaladoM=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let pushFechadoM=false,pushSalvoM=false,pushErrM='';try{pushFechadoM=localStorage.getItem('rm-push')==='x'}catch(e){}
const b64uM=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushAtivar(pedir){if(!pushOk()||!S.token)return false;
 try{if(pedir&&Notification.permission==='default'){const r=await Notification.requestPermission();if(r!=='granted'){pushErrM=r==='denied'?'bloqueado':'';return false}}
  if(Notification.permission!=='granted')return false;
  let reg=await navigator.serviceWorker.getRegistration();if(!reg)reg=await navigator.serviceWorker.register('sw.js');
  reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,no)=>setTimeout(()=>no(new Error('service worker não ficou pronto')),10000))]);
  let sub=await reg.pushManager.getSubscription();
  if(sub&&sub.options&&sub.options.applicationServerKey){const k=new Uint8Array(sub.options.applicationServerKey);if(btoa(String.fromCharCode(...k)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')!==VAPID){await sub.unsubscribe();sub=null}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uM(VAPID)});
  const r=await rpc('mot_push_salvar',{p_token:S.token,p_sub:sub.toJSON()});if(!r||!r.ok){pushErrM=(r&&r.erro)||'O servidor não aceitou.';return false}
  pushSalvoM=true;return true}catch(e){pushErrM=(e&&e.message)||String(e);return false}}
function pushCard(){if(S.leitura||pushFechadoM||!('Notification' in window))return'';
 if(ehIOSm&&!instaladoM()&&!('PushManager' in window))return `<div class="card" style="gap:6px"><h2>🔔 Receba as mensagens no celular</h2><p class="meta">No iPhone, instale o app primeiro: toque em Compartilhar › <b>Adicionar à Tela de Início</b> e abra por lá.</p><button class="btn line" type="button" data-a="pushx">Agora não</button></div>`;
 if(!pushOk()||Notification.permission!=='default')return'';
 return `<div class="card" style="gap:8px"><h2>🔔 Ativar notificações</h2><p class="meta">Receba no celular as mensagens da Logística, os avisos e a conversa com o profissional, mesmo com o app fechado.</p><div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><button class="btn sun" type="button" data-a="pushon">Ativar</button><button class="btn line" type="button" data-a="pushx">Agora não</button></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-a="pushon"],[data-a="pushx"]');if(!b)return;e.stopImmediatePropagation();
 if(b.dataset.a==='pushx'){pushFechadoM=true;try{localStorage.setItem('rm-push','x')}catch(x){}render();return}
 const ok=await pushAtivar(true);toast(ok?'Notificações ativadas.':pushErrM==='bloqueado'||Notification.permission==='denied'?'As notificações estão bloqueadas para este site. Libere nas configurações do navegador.':'Não foi possível ativar agora'+(pushErrM?' ('+pushErrM+')':'')+'.');render()},true);
function abreDoAviso(u){if(!S.token)return;if(/#canal/.test(u)){S.aba='chat';S.alvo='log';render();carregaLog()}else if(/#chat/.test(u)){S.aba='chat';S.alvo='prof';S.chat.n=-1;render();carregaChat()}}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.tipo==='rota-nova'&&e.data.url&&comNav())abreDoAviso(e.data.url)});
const HASH0=location.hash;if(/^#(canal|chat)/.test(HASH0)){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}const t0=setInterval(()=>{if(comNav()){clearInterval(t0);abreDoAviso(HASH0)}},500);setTimeout(()=>clearInterval(t0),20000)}
setTimeout(()=>{if(S.token&&!S.leitura&&!pushSalvoM&&pushOk()&&Notification.permission==='granted')pushAtivar(false)},4000);

/* leitura: endereço em duas linhas (rua / bairro em destaque), sem cidade e CEP quando é Rio; letra maior opcional */
var LETRA=false;try{LETRA=localStorage.getItem('rm-letra')==='1'}catch(e){}
document.documentElement.classList.toggle('letra',LETRA);
function partesEnd(e){const p=String(e||'').split(' - ').map(x=>x.trim()).filter(Boolean);if(p.length<2)return{rua:String(e||'').trim(),bairro:'',cidade:''};
 let resto=p.slice(1).join(', ').replace(/,?\s*\d{5}-?\d{3}\s*$/,'');
 const q=resto.split(',').map(x=>x.trim()).filter(x=>x&&!/^[A-Z]{2}$/.test(x)&&!/^\d{5}-?\d{3}$/.test(x));
 let cidade=q.length>1?q[q.length-1]:'',bairro=q.length>1?q.slice(0,-1).join(', '):(q[0]||'');
 return{rua:p[0],bairro,cidade:/^rio de janeiro$/i.test(cidade)?'':cidade}}
function endHtml(e){if(!e)return'';const x=partesEnd(e);return `<span class="vend">${esc(x.rua)}</span>${x.bairro||x.cidade?`<span class="vbai">${esc(x.bairro)}${x.cidade?(x.bairro?' · ':'')+esc(x.cidade):''}</span>`:''}`}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a="letra"]');if(!b)return;e.stopImmediatePropagation();LETRA=!LETRA;try{localStorage.setItem('rm-letra',LETRA?'1':'0')}catch(x){}document.documentElement.classList.toggle('letra',LETRA);render()},true);

/* visualização: só navegar e ver; qualquer ação que muda algo é bloqueada aqui (e também no servidor) */
const VER_OK=new Set(['verlib','amrec','rotarec','recarregar','letra','logout','voltar','vvoltar','gpsver','copia','pushx']);
document.addEventListener('click',e=>{if(!S.leitura)return;const b=e.target.closest&&e.target.closest('[data-a]');if(!b||VER_OK.has(b.dataset.a))return;e.preventDefault();e.stopImmediatePropagation();toast('Visualização da Logística: aqui só dá para ver.')},true);
document.addEventListener('submit',e=>{if(!S.leitura)return;e.preventDefault();e.stopImmediatePropagation();toast('Visualização da Logística: aqui só dá para ver.')},true);
</script>
